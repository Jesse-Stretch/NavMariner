<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>NavMariner</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

<style>
body { margin:0; font-family:Arial; background:#0b1e2d; color:white; }

#topBar {
  background:#102a44;
  padding:8px;
  display:flex;
  flex-direction:column;
  gap:6px;
}

input, button {
  padding:8px;
  border:none;
  border-radius:5px;
  font-size:14px;
}

button { background:#ffcc00; font-weight:bold; }

#map { height:calc(100vh - 140px); }

.info { font-size:13px; text-align:center; }
</style>
</head>

<body>

<div id="topBar">

  <div style="font-size:16px;font-weight:bold;text-align:center;">
    NavMariner
  </div>

  <!-- ROW 1 -->
  <div style="display:flex;gap:5px;">
    <input id="latInput" placeholder="Lat">
    <input id="lonInput" placeholder="Lon">
    <button onclick="addManual()">Add</button>
  </div>

  <!-- ROW 2 -->
  <div style="display:flex;gap:5px;">
    <input id="speedInput" placeholder="Knots">
    <button onclick="locateMe()">📍</button>
    <button onclick="clearAll()">✕</button>
    <button onclick="togglePro()" id="proBtn">Free</button>
  </div>

  <!-- INFO -->
  <div class="info">
    <span id="distanceOut">0</span> NM |
    ETA: <span id="etaOut">--</span>
  </div>

</div>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

// INIT MAP
let map = L.map('map').setView([49.37,-123.76],10);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

// STATE
let waypoints = [];
let markers = [];
let routeLine = L.polyline([], {color:'yellow', weight:4}).addTo(map);
let landPolygons = [];
let proMode = false;

// LOAD REAL COASTLINE
fetch('https://raw.githubusercontent.com/martynafford/natural-earth-geojson/master/110m/physical/ne_110m_land.geojson')
.then(r=>r.json())
.then(data=>{
  data.features.forEach(f=>{
    if(f.geometry.type === "Polygon"){
      landPolygons.push(f.geometry.coordinates);
    }
    if(f.geometry.type === "MultiPolygon"){
      f.geometry.coordinates.forEach(poly=>{
        landPolygons.push(poly);
      });
    }
  });
});

// CLICK TO ADD
map.on('click', e=>{
  addWaypoint(e.latlng.lat, e.latlng.lng);
});

// ADD WAYPOINT
function addWaypoint(lat, lon){

  waypoints.push([lat,lon]);

  let m = L.circleMarker([lat,lon],{
    radius:6,
    color:'red'
  }).addTo(map);

  m.on('click', e=>{
    L.DomEvent.stopPropagation(e);
    let i = markers.indexOf(m);
    markers.splice(i,1);
    waypoints.splice(i,1);
    map.removeLayer(m);
    calculateRoute();
  });

  markers.push(m);
  calculateRoute();
}

// CLEAR
function clearAll(){
  waypoints = [];
  markers.forEach(m=>map.removeLayer(m));
  markers = [];
  routeLine.setLatLngs([]);
  distanceOut.innerText = "0";
  etaOut.innerText = "--";
}

// PARSE COORDS
function parseCoord(input, isLat){
  input = input.trim().toUpperCase();

  let dir = null;
  if(input.includes("S") || input.includes("W")) dir = -1;
  if(input.includes("N") || input.includes("E")) dir = 1;

  input = input.replace(/[NSEW]/g,'');

  let val = parseFloat(input);
  if(isNaN(val)) return null;

  if(dir!==null) val *= dir;
  else if(!isLat) val = -Math.abs(val);

  return val;
}

// MANUAL ADD
function addManual(){
  let lat = parseCoord(latInput.value,true);
  let lon = parseCoord(lonInput.value,false);

  if(lat==null || lon==null){
    alert("Invalid coordinates");
    return;
  }

  addWaypoint(lat,lon);

  latInput.value="";
  lonInput.value="";
}

// DISTANCE
function haversine(a,b){
  let R=6371e3;
  let φ1=a[0]*Math.PI/180;
  let φ2=b[0]*Math.PI/180;
  let dφ=(b[0]-a[0])*Math.PI/180;
  let dλ=(b[1]-a[1])*Math.PI/180;

  let x=Math.sin(dφ/2)**2 +
  Math.cos(φ1)*Math.cos(φ2)*Math.sin(dλ/2)**2;

  let c=2*Math.atan2(Math.sqrt(x),Math.sqrt(1-x));

  return (R*c)/1852;
}

// INTERSECTION
function intersect(a,b,c,d){
  function ccw(p1,p2,p3){
    return (p3[1]-p1[1])*(p2[0]-p1[0]) >
           (p2[1]-p1[1])*(p3[0]-p1[0]);
  }
  return (ccw(a,c,d)!=ccw(b,c,d)) &&
         (ccw(a,b,c)!=ccw(a,b,d));
}

function lineHitsLand(a,b){
  for(let poly of landPolygons){
    for(let ring of poly){
      for(let i=0;i<ring.length;i++){
        let p1 = ring[i];
        let p2 = ring[(i+1)%ring.length];
        if(intersect(a,b,p1,p2)) return true;
      }
    }
  }
  return false;
}

// DETOUR
function findDetour(a,b){

  let midLat = (a[0]+b[0])/2;
  let midLon = (a[1]+b[1])/2;

  let offset = 0.3;

  let options = [
    [midLat + offset, midLon],
    [midLat - offset, midLon],
    [midLat, midLon + offset],
    [midLat, midLon - offset],
    [midLat + offset, midLon + offset],
    [midLat - offset, midLon - offset],
    [midLat + offset, midLon - offset],
    [midLat - offset, midLon + offset]
  ];

  for(let o of options){
    if(!lineHitsLand(a,o) && !lineHitsLand(o,b)){
      return o;
    }
  }

  return null;
}

// BUILD ROUTE
function buildRoute(a,b,depth=0){

  if(depth>6) return [a,b];

  if(!lineHitsLand(a,b)){
    return [a,b];
  }

  let d = findDetour(a,b);
  if(!d) return [a,b];

  let p1 = buildRoute(a,d,depth+1);
  let p2 = buildRoute(d,b,depth+1);

  return p1.slice(0,-1).concat(p2);
}

// MAIN ROUTE
function calculateRoute(){

  if(waypoints.length<2){
    routeLine.setLatLngs([]);
    updateStats([]);
    return;
  }

  let full = [];

  for(let i=1;i<waypoints.length;i++){
    let seg = buildRoute(waypoints[i-1], waypoints[i]);

    if(i>1) seg.shift();
    full = full.concat(seg);
  }

  routeLine.setLatLngs(full);
  updateStats(full);
}

// UPDATE DISTANCE + ETA (NOW REUSABLE)
function updateStats(path){

  if(path.length < 2){
    distanceOut.innerText = "0";
    etaOut.innerText = "--";
    return;
  }

  let dist = 0;
  for(let i=1;i<path.length;i++){
    dist += haversine(path[i-1],path[i]);
  }

  distanceOut.innerText = dist.toFixed(2);

  let speed = parseFloat(speedInput.value);

  if(!isNaN(speed) && speed > 0){
    let h = dist/speed;
    let hr = Math.floor(h);
    let min = Math.round((h-hr)*60);
    etaOut.innerText = hr+"h "+min+"m";
  } else {
    etaOut.innerText = "--";
  }
}

// 🔥 LIVE SPEED UPDATE (THIS FIXES YOUR ISSUE)
speedInput.addEventListener("input", ()=>{
  let path = routeLine.getLatLngs().map(p=>[p.lat,p.lng]);
  updateStats(path);
});

// PRO TOGGLE (kept)
function togglePro(){
  proMode = !proMode;
  proBtn.innerText = proMode ? "Pro" : "Free";
}

// GPS
function locateMe(){
  map.locate({setView:true});
}

</script>

</body>
</html>
