<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>NavMariner</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

<style>
body { margin:0; font-family:Arial; background:#0b1e2d; color:white; }
#topBar { background:#102a44; padding:6px; display:flex; flex-direction:column; gap:5px; }
.row { display:flex; gap:5px; flex-wrap:wrap; align-items:center; }
button { background:#ffcc00; border:none; padding:6px; border-radius:4px; font-weight:bold; }
input, select { padding:5px; border-radius:4px; border:none; }
#info { font-size:13px; padding:6px; background:#081724; }
#map { height: calc(100vh - 160px); }
</style>
</head>

<body>

<div id="topBar">
  <div class="row">
    <button onclick="locateMe()">📍</button>
    Speed <input id="speedInput" type="number" value="20" style="width:60px;">
  </div>
</div>

<div id="info">
  Dist: <span id="distance">0</span> NM |
  ETA: <span id="eta">0</span> min
</div>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
let map = L.map('map').setView([49.28,-123.12],9);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

let waypoints = [];
let markers = [];
let routeLine = L.polyline([], {color:'yellow'}).addTo(map);

// CLICK ADD
map.on('click', e=>{
  addWaypoint(e.latlng.lat, e.latlng.lng);
});

function addWaypoint(lat, lon){
  waypoints.push([lat, lon]);
  let marker = L.circleMarker([lat, lon], {radius:6,color:'red'}).addTo(map);

  marker.on('click', function(ev){
    L.DomEvent.stopPropagation(ev);
    let i = markers.indexOf(marker);
    markers.splice(i,1);
    waypoints.splice(i,1);
    map.removeLayer(marker);
    calculateRoute();
  });

  markers.push(marker);

  calculateRoute();
}

// 🔥 SIMPLE WATER MASK (fake coastline zones)
function isLand(lat, lon){
  // crude block zones (simulate land masses)
  if(lat > 49.3 && lon > -123.2) return true;
  if(lat < 49.1 && lon < -123.5) return true;
  return false;
}

// 🔥 GRID PATHFINDING
function findPath(start, end){
  let step = 0.02;
  let open = [start];
  let cameFrom = {};
  let visited = new Set();

  function key(p){ return p[0].toFixed(2)+","+p[1].toFixed(2); }

  while(open.length){
    let current = open.shift();
    let k = key(current);

    if(visited.has(k)) continue;
    visited.add(k);

    if(Math.abs(current[0]-end[0]) < step &&
       Math.abs(current[1]-end[1]) < step){
      let path = [];
      while(k){
        let parts = k.split(",");
        path.push([parseFloat(parts[0]), parseFloat(parts[1])]);
        k = cameFrom[k];
      }
      return path.reverse();
    }

    let dirs = [
      [step,0],[-step,0],[0,step],[0,-step],
      [step,step],[-step,-step],[step,-step],[-step,step]
    ];

    for(let d of dirs){
      let next = [current[0]+d[0], current[1]+d[1]];
      let nk = key(next);

      if(isLand(next[0], next[1])) continue;
      if(visited.has(nk)) continue;

      cameFrom[nk] = k;
      open.push(next);
    }
  }

  return [start,end]; // fallback
}

function calculateRoute(){
  let fullPath = [];

  for(let i=1;i<waypoints.length;i++){
    let segment = findPath(waypoints[i-1], waypoints[i]);
    fullPath = fullPath.concat(segment);
  }

  routeLine.setLatLngs(fullPath);

  updateStats(fullPath);
}

function updateStats(path){
  let meters = 0;

  for(let i=1;i<path.length;i++){
    meters += map.distance(path[i-1], path[i]);
  }

  let nm = meters/1852;
  distance.innerText = nm.toFixed(2);

  let speed = speedInput.value || 1;
  eta.innerText = Math.round((nm/speed)*60);
}

function locateMe(){
  map.locate({setView:true});
}
</script>

</body>
</html>
