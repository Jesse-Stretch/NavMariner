<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>NavMariner</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

<style>
body { margin:0; font-family:Arial; background:#0b1e2d; color:white; }

#topBar {
  background:#102a44;
  padding:6px;
  display:flex;
  flex-direction:column;
  gap:5px;
}

input, button {
  padding:6px;
  border:none;
  border-radius:5px;
  font-size:13px;
}

#speedInput { width:65px; }

button { background:#ffcc00; font-weight:bold; }

#map { height:calc(100vh - 130px); }

.info { font-size:12px; text-align:center; }

.coordLabel {
  background: rgba(0,0,0,0.7);
  color: #ffcc00;
  border: none;
  font-size: 11px;
  padding: 2px 6px;
  border-radius: 4px;
}
</style>
</head>

<body>

<div id="topBar">

  <div style="text-align:center;font-weight:bold;">NavMariner</div>

  <div style="display:flex;gap:5px;">
    <input id="latInput" placeholder="Lat">
    <input id="lonInput" placeholder="Lon">
    <button onclick="addManual()">Add</button>
  </div>

  <div style="display:flex;gap:5px;">
    <input id="speedInput" placeholder="kt">
    <button onclick="locateMe()">📍</button>
    <button onclick="clearAll()">✕</button>
    <button onclick="togglePro()" id="proBtn">Free</button>
  </div>

  <div class="info">
    <span id="distanceOut">0</span> NM |
    ETA: <span id="etaOut">--</span>
  </div>

</div>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

// MAP
let map = L.map('map').setView([49.37,-123.76],10);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

// STATE
let waypoints = [];
let markers = [];
let labels = [];
let routeLine = L.polyline([], {color:'yellow',weight:4}).addTo(map);
let landPolygons = [];
let proMode = false;

// LOAD LAND
fetch('https://raw.githubusercontent.com/martynafford/natural-earth-geojson/master/110m/physical/ne_110m_land.geojson')
.then(r=>r.json())
.then(data=>{
  data.features.forEach(f=>{
    if(f.geometry.type==="Polygon"){
      landPolygons.push(f.geometry.coordinates);
    } else {
      f.geometry.coordinates.forEach(p=>landPolygons.push(p));
    }
  });
});

// FORMAT COORDS
function formatCoord(lat, lon){

  function toDMS(val, isLat){
    let dir = isLat
      ? (val >= 0 ? "N" : "S")
      : (val >= 0 ? "E" : "W");

    val = Math.abs(val);

    let deg = Math.floor(val);
    let minFloat = (val - deg) * 60;
    let min = Math.floor(minFloat);
    let sec = Math.round((minFloat - min) * 60);

    return `${deg}°${min}'${sec}" ${dir}`;
  }

  return toDMS(lat, true) + "<br>" + toDMS(lon, false);
}

// CLICK ADD
map.on('click', e=>{
  addWaypoint(e.latlng.lat, e.latlng.lng);
});

// ADD WAYPOINT
function addWaypoint(lat, lon){

  waypoints.push([lat,lon]);

  let m = L.circleMarker([lat,lon],{
    radius:6,
    color:'red'
  }).addTo(map);

  let label = L.tooltip({
    permanent:true,
    direction:'top',
    offset:[0,-8],
    className:'coordLabel'
  })
  .setContent(formatCoord(lat,lon))
  .setLatLng([lat,lon])
  .addTo(map);

  m.on('click', e=>{
    L.DomEvent.stopPropagation(e);

    let i = markers.indexOf(m);

    map.removeLayer(m);
    map.removeLayer(labels[i]);

    markers.splice(i,1);
    labels.splice(i,1);
    waypoints.splice(i,1);

    calculateRoute();
  });

  markers.push(m);
  labels.push(label);

  calculateRoute();
}

// CLEAR
function clearAll(){
  waypoints = [];
  markers.forEach(m=>map.removeLayer(m));
  labels.forEach(l=>map.removeLayer(l));
  markers = [];
  labels = [];
  routeLine.setLatLngs([]);
  distanceOut.innerText="0";
  etaOut.innerText="--";
}

// PARSE
function parseCoord(v,isLat){
  let val=parseFloat(v);
  if(isNaN(val)) return null;
  if(!isLat) val=-Math.abs(val);
  return val;
}

// MANUAL
function addManual(){
  let lat=parseCoord(latInput.value,true);
  let lon=parseCoord(lonInput.value,false);
  if(lat==null||lon==null) return alert("Invalid");
  addWaypoint(lat,lon);
  latInput.value=""; lonInput.value="";
}

// DISTANCE
function hav(a,b){
  let R=6371e3;
  let φ1=a[0]*Math.PI/180, φ2=b[0]*Math.PI/180;
  let dφ=(b[0]-a[0])*Math.PI/180;
  let dλ=(b[1]-a[1])*Math.PI/180;
  let x=Math.sin(dφ/2)**2+Math.cos(φ1)*Math.cos(φ2)*Math.sin(dλ/2)**2;
  return (R*2*Math.atan2(Math.sqrt(x),Math.sqrt(1-x)))/1852;
}

// POINT IN POLY
function pointInPoly(pt, poly){
  let x=pt[1], y=pt[0], inside=false;
  for(let i=0,j=poly.length-1;i<poly.length;j=i++){
    let xi=poly[i][0], yi=poly[i][1];
    let xj=poly[j][0], yj=poly[j][1];
    let intersect=((yi>y)!=(yj>y)) &&
      (x<(xj-xi)*(y-yi)/(yj-yi)+xi);
    if(intersect) inside=!inside;
  }
  return inside;
}

function isLand(pt){
  for(let poly of landPolygons){
    for(let ring of poly){
      if(pointInPoly(pt,ring)) return true;
    }
  }
  return false;
}

// PATH CHECK
function pathHitsLand(a,b){
  let steps=25;
  for(let i=0;i<=steps;i++){
    let t=i/steps;
    let p=[a[0]+(b[0]-a[0])*t, a[1]+(b[1]-a[1])*t];
    if(isLand(p)) return true;
  }
  return false;
}

// DETOUR
function detour(a,b){
  let mid=[(a[0]+b[0])/2,(a[1]+b[1])/2];
  let off=0.4;

  let opts=[
    [mid[0]+off,mid[1]],[mid[0]-off,mid[1]],
    [mid[0],mid[1]+off],[mid[0],mid[1]-off],
    [mid[0]+off,mid[1]+off],[mid[0]-off,mid[1]-off],
    [mid[0]+off,mid[1]-off],[mid[0]-off,mid[1]+off]
  ];

  for(let o of opts){
    if(!pathHitsLand(a,o)&&!pathHitsLand(o,b)) return o;
  }
  return null;
}

// BUILD ROUTE
function build(a,b,d=0){
  if(d>7||!pathHitsLand(a,b)) return [a,b];
  let m=detour(a,b);
  if(!m) return [a,b];
  let p1=build(a,m,d+1), p2=build(m,b,d+1);
  return p1.slice(0,-1).concat(p2);
}

// ROUTE
function calculateRoute(){
  if(waypoints.length<2){
    routeLine.setLatLngs([]);
    updateStats([]);
    return;
  }

  let full=[];

  for(let i=1;i<waypoints.length;i++){
    let seg=build(waypoints[i-1],waypoints[i]);
    if(i>1) seg.shift();
    full=full.concat(seg);
  }

  routeLine.setLatLngs(full);
  updateStats(full);
}

// STATS
function updateStats(path){
  if(path.length<2){
    distanceOut.innerText="0";
    etaOut.innerText="--";
    return;
  }

  let d=0;
  for(let i=1;i<path.length;i++) d+=hav(path[i-1],path[i]);

  distanceOut.innerText=d.toFixed(2);

  let s=parseFloat(speedInput.value);

  if(s>0){
    let h=d/s, hr=Math.floor(h), m=Math.round((h-hr)*60);
    etaOut.innerText=hr+"h "+m+"m";
  } else {
    etaOut.innerText="--";
  }
}

// LIVE SPEED UPDATE
speedInput.addEventListener("input", ()=>{
  let path = routeLine.getLatLngs().map(p=>[p.lat,p.lng]);
  updateStats(path);
});

// GPS
function locateMe(){ map.locate({setView:true}); }

// PRO
function togglePro(){
  proMode=!proMode;
  proBtn.innerText=proMode?"Pro":"Free";
}

</script>

</body>
</html>
