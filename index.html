<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>NavMariner</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

<style>
body { margin:0; font-family:Arial; background:#0b1e2d; color:white; }

#topBar {
  background:#102a44;
  padding:12px;
  text-align:center;
}

input, button {
  padding:10px;
  margin:4px;
  border:none;
  border-radius:5px;
  font-size:14px;
}

button { background:#ffcc00; font-weight:bold; }

#map { height:calc(100vh - 220px); }

.info { margin-top:8px; font-size:14px; }
</style>
</head>

<body>

<div id="topBar">

  <div><strong>NavMariner</strong></div>

  <div>
    <input id="latInput" placeholder="Latitude">
    <input id="lonInput" placeholder="Longitude">
    <button onclick="addManual()">Add</button>
  </div>

  <div>
    <input id="speedInput" placeholder="Speed (knots)">
    <button onclick="locateMe()">📍</button>
    <button onclick="clearAll()">Clear</button>
  </div>

  <div>
    <button onclick="togglePro()" id="proBtn">Free Mode</button>
  </div>

  <div class="info">
    Distance: <span id="distanceOut">0</span> NM |
    ETA: <span id="etaOut">--</span>
  </div>

</div>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

// INIT
let map = L.map('map').setView([49.28,-123.12],9);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

let waypoints = [];
let markers = [];
let routeLine = L.polyline([], {color:'yellow', weight:4}).addTo(map);
let proMode = false;
let landPolygons = [];

// LOAD LAND
fetch('https://raw.githubusercontent.com/johan/world.geo.json/master/countries/CAN.geo.json')
.then(r=>r.json())
.then(data=>{
  data.features.forEach(f=> landPolygons.push(f.geometry.coordinates));
});

// CLICK ADD
map.on('click', e=> addWaypoint(e.latlng.lat, e.latlng.lng));

// ADD WAYPOINT
function addWaypoint(lat, lon){
  waypoints.push([lat,lon]);

  let m = L.circleMarker([lat,lon],{radius:6,color:'red'}).addTo(map);

  m.on('click', e=>{
    L.DomEvent.stopPropagation(e);
    let i = markers.indexOf(m);
    markers.splice(i,1);
    waypoints.splice(i,1);
    map.removeLayer(m);
    calculateRoute();
  });

  markers.push(m);
  calculateRoute();
}

// CLEAR
function clearAll(){
  waypoints = [];
  markers.forEach(m=>map.removeLayer(m));
  markers = [];
  routeLine.setLatLngs([]);
}

// PARSE INPUT
function parseCoord(input, isLat){
  input = input.trim().toUpperCase();

  let dir = null;
  if(input.includes("S") || input.includes("W")) dir = -1;
  else if(input.includes("N") || input.includes("E")) dir = 1;

  input = input.replace(/[NSEW]/g,'');

  let parts = input.split(/[\s]+/).filter(p=>p);

  let val = parseFloat(parts[0]);
  if(parts.length>1) val += parseFloat(parts[1])/60;
  if(parts.length>2) val += parseFloat(parts[2])/3600;

  if(isNaN(val)) return null;

  if(dir!==null) val*=dir;
  else if(!isLat) val = -Math.abs(val);

  return val;
}

// MANUAL ADD
function addManual(){
  let lat = parseCoord(latInput.value,true);
  let lon = parseCoord(lonInput.value,false);

  if(lat==null||lon==null) return alert("Invalid coords");

  addWaypoint(lat,lon);

  latInput.value="";
  lonInput.value="";
}

// HAVERSINE
function haversine(a,b){
  let R=6371e3;
  let φ1=a[0]*Math.PI/180;
  let φ2=b[0]*Math.PI/180;
  let dφ=(b[0]-a[0])*Math.PI/180;
  let dλ=(b[1]-a[1])*Math.PI/180;

  let x=Math.sin(dφ/2)**2+
  Math.cos(φ1)*Math.cos(φ2)*Math.sin(dλ/2)**2;

  let c=2*Math.atan2(Math.sqrt(x),Math.sqrt(1-x));

  return (R*c)/1852;
}

// SIMPLE LAND CHECK (ROUGH)
function isLand(lat,lon){
  return false; // disabled for smoother routing
}

// SMOOTH ROUTE
function smoothPath(path){
  let smooth=[];
  for(let i=0;i<path.length-1;i++){
    let a=path[i];
    let b=path[i+1];

    smooth.push(a);

    for(let t=0.25;t<1;t+=0.25){
      smooth.push([
        a[0]+(b[0]-a[0])*t,
        a[1]+(b[1]-a[1])*t
      ]);
    }
  }
  smooth.push(path[path.length-1]);
  return smooth;
}

// ROUTE
function calculateRoute(){

  if(waypoints.length<2){
    routeLine.setLatLngs([]);
    return;
  }

  let path = [...waypoints];

  if(proMode){
    path = smoothPath(path);
  }

  routeLine.setLatLngs(path);

  // DISTANCE
  let dist=0;
  for(let i=1;i<path.length;i++){
    dist+=haversine(path[i-1],path[i]);
  }

  distanceOut.innerText = dist.toFixed(2);

  let speed = parseFloat(speedInput.value);

  if(speed>0){
    let h = dist/speed;
    let hr=Math.floor(h);
    let min=Math.round((h-hr)*60);
    etaOut.innerText = hr+"h "+min+"m";
  } else {
    etaOut.innerText="--";
  }
}

// PRO TOGGLE
function togglePro(){
  proMode = !proMode;
  proBtn.innerText = proMode ? "Pro Mode" : "Free Mode";
  calculateRoute();
}

// GPS
function locateMe(){
  map.locate({setView:true});
}

</script>

</body>
</html>
